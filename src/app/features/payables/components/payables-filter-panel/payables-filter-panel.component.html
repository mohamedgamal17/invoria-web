<app-surface-card tone="neutral">
  <div class="flex flex-col gap-4">
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div class="flex items-center gap-2 text-foreground">
        <i class="pi pi-filter text-muted-foreground" aria-hidden="true"></i>
        <span class="text-sm font-bold uppercase tracking-wider text-muted-foreground"
          >Filters</span
        >
      </div>
      <p-button
        label="Clear filters"
        icon="pi pi-times"
        [text]="true"
        severity="secondary"
        styleClass="text-sm shrink-0 self-start sm:self-auto"
        [disabled]="loading()"
        (onClick)="onClear()"
      />
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="flex flex-col gap-1.5">
        <label
          class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider"
          for="payables-filter-supplier"
          >Supplier</label
        >
        <p-select
          inputId="payables-filter-supplier"
          [options]="supplierOptions()"
          optionLabel="label"
          optionValue="value"
          [filter]="true"
          filterPlaceholder="Search suppliers…"
          [ngModel]="localSupplierId() || null"
          (ngModelChange)="onSupplierIdChange($event)"
          [loading]="loading()"
          placeholder="All suppliers"
          [disabled]="loading()"
          appendTo="body"
          [showClear]="true"
          class="w-full"
          styleClass="w-full rounded-lg border-border bg-surface-2 text-sm min-h-[2.5rem]"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label
          class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider"
          for="payables-filter-source"
          >Purchase Order ID</label
        >
        <p-iconfield iconPosition="left" class="w-full">
          <p-inputicon styleClass="pi pi-receipt" />
          <input
            id="payables-filter-source"
            pInputText
            type="text"
            [ngModel]="localSourceId()"
            (ngModelChange)="onSourceIdInput($event)"
            [disabled]="loading()"
            placeholder="Search by purchase order ID…"
            class="w-full rounded-lg border-border bg-surface-2 py-2 text-sm focus:ring-2 focus:ring-focus"
          />
        </p-iconfield>
      </div>

      <div class="flex flex-col gap-1.5">
        <label
          class="text-[10px] font-bold text-muted-foreground uppercase tracking-wider"
          for="payables-filter-paid"
          >Paid status</label
        >
        <p-select
          inputId="payables-filter-paid"
          [options]="isPaidOptions"
          optionLabel="label"
          optionValue="value"
          [ngModel]="isPaid()"
          (ngModelChange)="onIsPaidChange($event)"
          placeholder="All"
          [disabled]="loading()"
          appendTo="body"
          [showClear]="true"
          styleClass="w-full rounded-lg border-border bg-surface-2 text-sm min-h-[2.5rem]"
        />
      </div>
    </div>
  </div>
</app-surface-card>
