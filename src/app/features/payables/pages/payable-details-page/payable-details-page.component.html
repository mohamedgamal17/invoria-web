<p-toast />

<section class="flex flex-col gap-8">
  <app-details-toolbar backLabel="Back to payables" (back)="backToList()" />

  @if (loading()) {
    <app-details-skeleton />
  } @else if (requestError(); as errorMessage) {
    <app-error-card title="Unable to load payable" [message]="errorMessage" (retry)="retry()" />
  } @else if (payable(); as payable) {
    <app-page-header
      [title]="payable.id"
      [description]="
        'Supplier: ' +
        payable.partyId +
        ' &middot; Purchase order: ' +
        payable.sourceId +
        ' &middot; ' +
        (payable.createdAt | date: 'medium')
      "
      eyebrow="Payable"
      eyebrowIcon="pi pi-file"
    />

    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" [lazy]="true">
      <p-tablist>
        <p-tab [value]="tabs.Overview">Overview</p-tab>
        <p-tab [value]="tabs.Settlements">Settlements</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="tabs.Overview">
          <div class="pt-5">
            <app-financial-obligation-overview-card
              [obligation]="payable"
              entityLabel="Payable"
              partyLabel="Supplier"
              sourceLabel="Purchase Order"
              partyRoute="/suppliers"
              sourceRoute="/procurement"
              sourceDisplayKey="purchaseNumber"
              [currencyCode]="currencyCode"
              (settleRequest)="openSettleModal()"
            />
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="tabs.Settlements">
          <div class="pt-5">
            <app-settlements-tab
              [settlements]="payable.settlements"
              [currencyCode]="currencyCode"
              [outstandingAmount]="payable.outstandingAmount"
              entityName="payable"
              (settleRequest)="openSettleModal()"
            />
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>

    <app-settle-modal
      [visible]="settleModalVisible()"
      (visibleChange)="onSettleModalVisibleChange($event)"
      [outstandingAmount]="payable.outstandingAmount"
      [currencyCode]="currencyCode"
      [settling]="isSettling()"
      (settle)="onSettle($event)"
      (cancel)="closeSettleModal()"
    />
  }
</section>
