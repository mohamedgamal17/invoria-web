<p-toast />

<section class="flex flex-col gap-8">
  <app-payable-header />

  <app-payables-filter-panel
    [suppliers]="suppliersResource.value()"
    [supplierId]="supplierIdFilter()"
    [sourceId]="sourceIdFilter()"
    [isPaid]="isPaidFilter()"
    [loading]="listLoading()"
    (filtersChange)="onFiltersChange($event)"
    (clearFilters)="onClearFilters()"
  />

  <app-financial-obligation-list
    [obligations]="payables()"
    [isListLoading]="listLoading()"
    [totalRecords]="paging().totalCount"
    [first]="first()"
    [pageSize]="pageSize()"
    entityPlural="payables"
    partyLabel="Supplier"
    sourceLabel="Purchase Order"
    sourceDisplayKey="purchaseNumber"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="onPageChange($event)"
    (clearFilters)="onClearFilters()"
    (viewObligation)="goToDetails($event)"
  />
</section>
