<p-toast />

<section class="flex flex-col gap-8">
  <app-payable-header />

  <app-payables-filter-panel
    [suppliers]="suppliersResource.value()"
    [supplierId]="supplierIdFilter()"
    [sourceId]="sourceIdFilter()"
    [isPaid]="isPaidFilter()"
    [loading]="listLoading()"
    (filtersChange)="onFiltersChange($event)"
    (clearFilters)="onClearFilters()"
  />

  <app-payable-list
    [payables]="payables()"
    [isListLoading]="listLoading()"
    [totalRecords]="paging().totalCount"
    [first]="first()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="onPageChange($event)"
    (clearFilters)="onClearFilters()"
    (viewPayable)="goToDetails($event)"
  />
</section>
