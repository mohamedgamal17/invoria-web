<section class="flex flex-col gap-8">
  <app-details-toolbar backLabel="Back to invoices" (back)="backToList()" />

  @if (loading()) {
    <app-details-skeleton />
  } @else if (error(); as errorMessage) {
    <app-error-card title="Unable to load invoice" [message]="errorMessage" (retry)="retry()" />
  } @else if (displayInvoice(); as invoice) {
    <app-page-header
      [title]="invoice.invoiceNumber || invoice.id"
      [description]="
        'Customer: ' +
        invoice.customerId +
        ' &middot; Order: ' +
        invoice.orderId +
        ' &middot; ' +
        (invoice.createdAt | date: 'medium')
      "
      eyebrow="Invoice"
      eyebrowIcon="pi pi-file"
    />

    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" [lazy]="true">
      <p-tablist>
        <p-tab [value]="tabs.Overview">Overview</p-tab>
        <p-tab [value]="tabs.Items">Line Items</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="tabs.Overview">
          <div class="pt-5">
            <app-invoice-details-overview-card [invoice]="invoice" [currencyCode]="currencyCode" />
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="tabs.Items">
          <div class="pt-5">
            <app-invoice-details-items-tab [items]="invoice.items" [currencyCode]="currencyCode" />
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</section>
