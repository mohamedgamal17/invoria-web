<section class="flex flex-col gap-8">
  <app-invoice-header />

  <app-invoices-filter-panel
    [customerId]="customerIdFromRoute()"
    [orderId]="orderIdFromRoute()"
    [loading]="listLoading()"
    (filtersChange)="onFiltersChange($event)"
    (clearFilters)="onClearFilters()"
  />

  <app-invoice-list
    [invoices]="displayInvoices()"
    [isListLoading]="listLoading()"
    [totalRecords]="displayPaging().totalCount"
    [first]="first()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="onPageChange($event)"
    (clearFilters)="onClearFilters()"
    (viewInvoice)="goToDetails($event)"
  />
</section>
