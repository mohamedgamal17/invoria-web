<section class="space-y-6">
  <header class="flex flex-col gap-1">
    <h1 class="text-2xl font-semibold">Dashboard</h1>
    <p class="text-sm text-muted-foreground">Today’s operational snapshot.</p>
  </header>

  <section class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <app-kpi-card title="Open orders" value="18" hint="Need action" tone="warning" />
    <app-kpi-card title="Low stock items" value="7" hint="Below reorder" tone="danger" />
    <app-kpi-card title="Items received" value="42" hint="Last 24h" tone="success" />
    <app-kpi-card title="On-time delivery" value="96%" hint="Last 7d" tone="primary" />
  </section>

  <section class="grid grid-cols-1 gap-4 lg:grid-cols-3">
    <div class="lg:col-span-1">
      <app-quick-actions />
    </div>
    <div class="lg:col-span-2">
      <app-surface-card tone="accent">
        <div class="text-sm font-semibold">API-connected modules</div>
        <p class="mt-1 text-sm text-muted-foreground">
          Deployment scope currently focuses on backend-driven flows.
        </p>
        <div class="mt-4 grid grid-cols-1 gap-2 sm:grid-cols-2">
          <div class="rounded-md border border-border/70 bg-surface-2 px-3 py-2 text-xs font-semibold uppercase tracking-wide">Orders</div>
          <div class="rounded-md border border-border/70 bg-surface-2 px-3 py-2 text-xs font-semibold uppercase tracking-wide">Products</div>
          <div class="rounded-md border border-border/70 bg-surface-2 px-3 py-2 text-xs font-semibold uppercase tracking-wide">Customers</div>
          <div class="rounded-md border border-border/70 bg-surface-2 px-3 py-2 text-xs font-semibold uppercase tracking-wide">Suppliers</div>
          <div class="rounded-md border border-border/70 bg-surface-2 px-3 py-2 text-xs font-semibold uppercase tracking-wide">Procurement</div>
          <div class="rounded-md border border-border/70 bg-surface-2 px-3 py-2 text-xs font-semibold uppercase tracking-wide">Inventory batches</div>
        </div>
      </app-surface-card>
    </div>
  </section>

  <section>
    <app-surface-card>
      <div class="text-sm font-semibold">Notes</div>
      <p class="mt-2 text-sm text-muted-foreground">
        Non-API placeholder modules were removed from primary navigation to keep deployment scope focused.
      </p>
    </app-surface-card>
  </section>
</section>
