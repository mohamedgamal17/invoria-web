<div class="rounded-md border border-border bg-surface p-4 shadow-sm">
  <div class="flex items-center justify-between gap-3">
    <div>
      <div class="text-sm font-semibold">Low stock</div>
      <p class="mt-1 text-sm text-muted-foreground">Items near or below reorder point.</p>
    </div>
      <p-button
        styleClass="rounded-md border border-border bg-surface-2 px-3 py-2 text-sm hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus"
        label="Open inventory"
        (onClick)="goToInventory()"
      />
  </div>

  <div class="mt-4 overflow-hidden rounded-md border border-border">
    <div class="grid grid-cols-[1fr_auto] gap-2 bg-surface-2 px-3 py-2 text-xs font-semibold text-muted-foreground">
      <div>Item</div>
      <div class="text-right">On hand</div>
    </div>
    <div class="divide-y divide-border">
      @for (item of items; track item.id) {
        <div class="grid grid-cols-[1fr_auto] items-center gap-2 bg-surface px-3 py-3">
          <div class="min-w-0">
            <div class="truncate text-sm font-medium text-foreground">{{ item.name }}</div>
            <div class="mt-1 text-xs text-muted-foreground">{{ item.sku }} • Reorder at {{ item.reorderAt }}</div>
          </div>
          <div class="text-right">
            <div class="text-sm font-semibold">{{ item.onHand }}</div>
            <p-badge
              class="mt-1"
              value="Low"
              styleClass="inline-flex rounded-full bg-danger px-2 py-0.5 text-xs font-semibold text-danger-foreground"
            />
          </div>
        </div>
      }
    </div>
  </div>
</div>
