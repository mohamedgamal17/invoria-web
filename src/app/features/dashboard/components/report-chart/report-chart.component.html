<section class="rounded-xl border border-border bg-surface p-4 shadow-sm">
  <header class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div class="min-w-0">
      <h3 class="text-sm font-semibold tracking-tight">{{ title() }}</h3>
      @if (subtitle()) {
        <p class="mt-0.5 text-xs text-muted-foreground">{{ subtitle() }}</p>
      }
    </div>
    <div class="flex flex-wrap items-center gap-2 sm:gap-3">
      @if (showPeriodSelector()) {
        <p-selectButton
          [options]="periodOptions()"
          [ngModel]="selectedPeriod()"
          (ngModelChange)="onPeriodChange($event)"
          optionLabel="label"
          optionValue="value"
          [allowEmpty]="false"
          styleClass="text-sm"
        />
      }
      <ng-content />
      @if (loading()) {
        <span class="h-2 w-2 animate-pulse rounded-full bg-primary/60"></span>
      }
    </div>
  </header>

  @if (loading()) {
    <div [class]="'w-full rounded-lg ' + heightClass()">
      <p-skeleton width="100%" height="100%" styleClass="h-full rounded-lg" />
    </div>
  } @else {
    <div
      echarts
      [options]="(options() ?? emptyOptions())!"
      [autoResize]="true"
      [class]="'w-full ' + heightClass()"
    ></div>
  }
</section>
