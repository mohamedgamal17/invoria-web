<div class="rounded-md border border-border bg-surface p-4 shadow-sm">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <div class="truncate text-sm text-muted-foreground">{{ title }}</div>
      <div class="mt-1 text-2xl font-semibold">{{ value }}</div>
      @if (hint) {
        <div class="mt-1 text-xs text-muted-foreground">{{ hint }}</div>
      }
    </div>
    <p-badge
      class="shrink-0"
      [value]="tone"
      [styleClass]="toneClasses + ' rounded-full px-2 py-1 text-xs font-semibold'"
    />
  </div>
</div>
