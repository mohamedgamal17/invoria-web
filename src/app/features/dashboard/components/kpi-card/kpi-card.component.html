<div class="rounded-2xl border border-border bg-surface p-5 shadow-sm transition hover:shadow-md">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0 flex-1 space-y-1">
      <p class="truncate text-xs font-medium uppercase tracking-wider text-muted-foreground">{{ title }}</p>
      @if (loading) {
        <p-skeleton width="5rem" height="1.75rem" styleClass="mt-1 rounded-md" />
        <p-skeleton width="7rem" height="0.75rem" styleClass="mt-2 rounded-md" />
      } @else {
        <div class="text-2xl font-bold tracking-tight">{{ displayValue }}</div>
        @if (hint) {
          <p class="text-xs leading-relaxed text-muted-foreground">{{ hint }}</p>
        }
      }
    </div>
    @if (icon) {
      <div class="grid h-14 w-14 shrink-0 place-items-center rounded-2xl" [class]="iconContainerClasses">
        <lucide-icon [img]="$any(icon)" [size]="iconSize"></lucide-icon>
      </div>
    }
  </div>
  <ng-content />
</div>
