<div class="rounded-md border border-border bg-surface p-4 shadow-sm">
  <div class="flex items-center justify-between gap-3">
    <div>
      <div class="text-sm font-semibold">Recent activity</div>
      <p class="mt-1 text-sm text-muted-foreground">Latest events across the system.</p>
    </div>
    <p-button
      styleClass="rounded-md border border-border bg-surface-2 px-3 py-2 text-sm hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus"
      label="View all"
      (onClick)="goToReports()"
    />
  </div>

  <div class="mt-4 divide-y divide-border rounded-md border border-border">
    @for (item of items; track item.id) {
      <div class="flex items-start justify-between gap-3 bg-surface p-3">
        <div class="min-w-0">
          <div class="truncate text-sm font-medium">{{ item.title }}</div>
          <div class="mt-1 text-xs text-muted-foreground">{{ item.meta }}</div>
        </div>
        <span class="mt-1 h-2 w-2 shrink-0 rounded-full bg-border" aria-hidden="true"></span>
      </div>
    }
  </div>
</div>
