<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '92vw', maxWidth: '920px', height: '86vh' }"
  [draggable]="false"
  [resizable]="false"
  (onHide)="onDialogHide()"
  appendTo="body"
  [styleClass]="'rounded-2xl overflow-hidden shadow-lg border-0'"
  [contentStyleClass]="'flex flex-col min-h-0 h-full overflow-hidden bg-surface p-4 md:p-5'"
>
  <ng-template pTemplate="header">
    <div class="flex flex-col gap-1">
      <span class="text-xs font-bold uppercase tracking-widest text-primary"
        >Inventory Management</span
      >
      <h2
        class="m-0 max-w-full truncate text-2xl font-extrabold leading-none text-foreground md:text-3xl"
      >
        {{ product()?.name }}
      </h2>
    </div>
  </ng-template>

  <app-product-batches-panel
    [first]="first()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="onPanelPageChange($event)"
  />
</p-dialog>
