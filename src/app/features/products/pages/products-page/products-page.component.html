<section class="flex flex-col gap-8">
  <app-products-breadcrumb [items]="breadcrumbItems" />

  <app-product-header (create)="goToCreate()" />

  <app-products-filter-panel
    [name]="nameFilter()"
    [loading]="listLoading()"
    (filtersChange)="onFiltersChange($event)"
    (clearFilters)="onClearFilters()"
  />

  <app-product-list
    [products]="products()"
    [totalRecords]="paging().totalCount"
    [first]="first()"
    [pageSize]="pageSize()"
    [isListLoading]="listLoading()"
    [pageSizeOptions]="pageSizeOptions"
    (viewProduct)="goToDetails($event)"
    (pageChange)="onPageChange($event)"
    (clearFilters)="onClearFilters()"
  />
</section>
