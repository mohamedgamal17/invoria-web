<p-toast />
<p-confirmDialog />

<section class="space-y-6">
  <app-product-header (create)="openCreateModal()" />

  <app-product-list
    [products]="displayProducts()"
    [totalRecords]="displayPaging().totalCount"
    [first]="first()"
    [pageSize]="pageSize()"
    [isListLoading]="productsResource.isLoading()"
    [pageSizeOptions]="pageSizeOptions"
    (edit)="openEditModal($event)"
    (delete)="deleteProduct($event)"
    (pageChange)="onPageChange($event)"
    (viewBatches)="viewBatches($event)"
  />
</section>

<app-product-dialog
  [(visible)]="modalVisible"
  [mode]="modalMode()"
  [product]="selectedProduct()"
  [saving]="modalSaving()"
  (save)="submitModal($event)"
  (cancel)="closeModal()"
  (hide)="onModalHide()"
/>

<app-product-batches-modal
  [(visible)]="batchesVisible"
  [product]="selectedProductForInventory()"
  (batchesMutated)="onBatchesMutated()"
/>
