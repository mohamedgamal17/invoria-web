<p-toast />

<section class="flex flex-col gap-8">
  <app-products-breadcrumb [items]="breadcrumbItems()" />
  <app-details-toolbar
    title="Product Details"
    description="View pricing, stock and lifecycle history for this product."
    backLabel="Back to Products"
    (back)="backToList()"
  />

  @if (loading()) {
    <app-details-skeleton />
  } @else if (error(); as inlineError) {
    <app-error-card title="Unable to load product" [message]="inlineError" (retry)="retry()" />
  } @else if (product(); as product) {
    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" [lazy]="true">
      <p-tablist>
        <p-tab [value]="tabs.Info">Info</p-tab>
        <p-tab [value]="tabs.Batches">Batches</p-tab>
        <p-tab [value]="tabs.Orders">Orders</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="tabs.Info">
          <app-product-details-info-panel [product]="product" (edit)="goToEdit()" />
        </p-tabpanel>

        <p-tabpanel [value]="tabs.Batches">
          <div class="pt-6">
            <p-card styleClass="border border-border/60 rounded-2xl shadow-sm">
              <div class="mb-4 flex flex-col gap-1 border-b border-border pb-4">
                <span class="text-xs font-bold uppercase tracking-widest text-primary"
                  >Inventory</span
                >
                <p class="m-0 text-sm text-muted-foreground">
                  Manage batches and stock for this product.
                </p>
              </div>
              <app-product-batches-panel
                [batches]="batches()"
                [loading]="batchesLoading()"
                [saving]="batchesSaving()"
                [saveStatus]="batchesSaveStatus()"
                [totalRecords]="totalRecords()"
                [first]="first()"
                [pageSize]="pageSize()"
                [pageSizeOptions]="pageSizeOptions"
                (save)="onBatchesSave($event)"
                (pageChange)="onBatchesPageChange($event)"
              />
            </p-card>
          </div>
        </p-tabpanel>

        <p-tabpanel [value]="tabs.Orders">
          <div class="pt-6">
            <app-product-details-orders-panel
              [rows]="productOrderRows()"
              [aggregate]="productOrdersAggregate()"
              [loading]="productOrdersLoading()"
              (viewOrder)="onViewProductOrder($event)"
              (reload)="onReloadProductOrders()"
            />
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</section>
