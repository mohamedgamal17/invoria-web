<p-toast />

<section class="flex flex-col gap-8">
  <app-products-breadcrumb [items]="breadcrumbItems()" />
  <app-product-details-toolbar (back)="backToList()" />

  @if (loading()) {
    <p-card styleClass="border border-border/60 rounded-2xl shadow-sm">
      <div class="space-y-5 p-1">
        <p-skeleton height="2rem" width="45%"></p-skeleton>
        <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
          <p-skeleton height="5.5rem"></p-skeleton>
          <p-skeleton height="5.5rem"></p-skeleton>
          <p-skeleton height="5.5rem"></p-skeleton>
        </div>
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <p-skeleton height="5rem"></p-skeleton>
          <p-skeleton height="5rem"></p-skeleton>
          <p-skeleton height="5rem"></p-skeleton>
          <p-skeleton height="5rem"></p-skeleton>
        </div>
      </div>
    </p-card>
  } @else if (error()) {
    <p-card styleClass="border border-destructive/30 rounded-2xl shadow-sm">
      <div class="flex flex-col gap-4 p-1 sm:flex-row sm:items-center sm:justify-between">
        <div class="space-y-1">
          <h2 class="text-base font-semibold text-foreground">Unable to load product</h2>
          <p class="text-sm text-destructive">{{ error() }}</p>
        </div>
        <p-button
          label="Retry"
          icon="pi pi-refresh"
          styleClass="rounded-xl px-4 py-2.5 text-sm font-semibold"
          (onClick)="retry()"
        />
      </div>
    </p-card>
  } @else if (product(); as p) {
    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" [lazy]="true">
      <p-tablist>
        <p-tab [value]="0">Info</p-tab>
        <p-tab [value]="1">Batches</p-tab>
        <p-tab [value]="2">Orders</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="0">
          <app-product-details-info-panel [product]="p" (edit)="goToEdit()" />
        </p-tabpanel>

        <p-tabpanel [value]="1">
          <div class="pt-6">
            <p-card styleClass="border border-border/60 rounded-2xl shadow-sm">
              <div class="mb-4 flex flex-col gap-1 border-b border-border pb-4">
                <span class="text-xs font-bold uppercase tracking-widest text-primary">Inventory</span>
                <p class="m-0 text-sm text-muted-foreground">Manage batches and stock for this product.</p>
              </div>
              <app-product-batches-panel
                [product]="batchesProductRef()"
                [active]="activeTab() === 1"
                [first]="first()"
                [pageSize]="pageSize()"
                [pageSizeOptions]="pageSizeOptions"
                (pageChange)="onPageChange($event)"
                (batchesMutated)="onBatchesMutated()"
              />
            </p-card>
          </div>
        </p-tabpanel>

        <p-tabpanel [value]="2">
          <div class="pt-6">
            <p-card styleClass="border border-border/60 rounded-2xl shadow-sm">
              <div class="mb-4 flex flex-col gap-1 border-b border-border pb-4">
                <span class="text-xs font-bold uppercase tracking-widest text-primary">Orders</span>
                <p class="m-0 text-sm text-muted-foreground">
                  Line subtotals, return subtotals, and net amounts for this product across customer orders.
                </p>
              </div>
              <app-product-details-orders-panel
                [productId]="p.id"
                [active]="activeTab() === 2"
              />
            </p-card>
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</section>
