<section class="flex flex-col gap-8">
  <app-products-breadcrumb [items]="breadcrumbItems()" />

  <div class="flex items-start justify-between">
    <p-button
      icon="pi pi-arrow-left"
      label="Back to Products"
      [text]="true"
      styleClass="px-0 text-sm text-muted-foreground hover:text-foreground self-start"
      (onClick)="backToList()"
    />
    <div class="flex flex-wrap gap-2">
      <p-button
        label="Edit"
        icon="pi pi-pencil"
        [disabled]="actionsDisabled()"
        (onClick)="goToEdit()"
      />
    </div>
  </div>

  @if (loading()) {
    <p-card styleClass="border border-border/70">
      <div class="space-y-6">
        <div class="space-y-2">
          <p-skeleton height="2rem" width="38%"></p-skeleton>
          <p-skeleton height="1rem" width="22%"></p-skeleton>
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div class="rounded-xl border border-border/60 bg-surface-2/40 p-4 space-y-2">
            <p-skeleton height="0.75rem" width="35%"></p-skeleton>
            <p-skeleton height="1.75rem" width="45%"></p-skeleton>
          </div>
          <div class="rounded-xl border border-border/60 bg-surface-2/40 p-4 space-y-2">
            <p-skeleton height="0.75rem" width="45%"></p-skeleton>
            <p-skeleton height="1.75rem" width="50%"></p-skeleton>
          </div>
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <p-skeleton height="5rem" width="100%"></p-skeleton>
          <p-skeleton height="5rem" width="100%"></p-skeleton>
        </div>
      </div>
    </p-card>
  } @else if (error()) {
    <p-card styleClass="border border-destructive/30 bg-destructive/5">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div class="space-y-1">
          <p class="text-sm font-semibold text-destructive">Could not load product details.</p>
          <p class="text-sm text-destructive/90">{{ error() }}</p>
        </div>
        <p-button label="Retry" icon="pi pi-refresh" [outlined]="true" (onClick)="retry()" />
      </div>
    </p-card>
  } @else if (product(); as p) {
    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" [lazy]="true">
      <p-tablist>
        <p-tab [value]="0">Info</p-tab>
        <p-tab [value]="1">Batches</p-tab>
        <p-tab [value]="2">Orders</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="0">
          <app-product-details-info-panel [product]="p" />
        </p-tabpanel>

        <p-tabpanel [value]="1">
          <div class="pt-6">
            <p-card styleClass="border border-border">
              <div class="mb-4 flex flex-col gap-1 border-b border-border pb-4">
                <span class="text-xs font-bold uppercase tracking-widest text-primary">Inventory</span>
                <p class="m-0 text-sm text-muted-foreground">Manage batches and stock for this product.</p>
              </div>
              <app-product-batches-panel
                [product]="batchesProductRef()"
                [active]="activeTab() === 1"
                [first]="first()"
                [pageSize]="pageSize()"
                [pageSizeOptions]="pageSizeOptions"
                (pageChange)="onPageChange($event)"
                (batchesMutated)="onBatchesMutated()"
              />
            </p-card>
          </div>
        </p-tabpanel>

        <p-tabpanel [value]="2">
          <div class="pt-6">
            <p-card styleClass="border border-border">
              <div class="mb-4 flex flex-col gap-1 border-b border-border pb-4">
                <span class="text-xs font-bold uppercase tracking-widest text-primary">Orders</span>
                <p class="m-0 text-sm text-muted-foreground">
                  Line subtotals, return subtotals, and net amounts for this product across customer orders.
                </p>
              </div>
              <app-product-details-orders-panel
                [productId]="p.id"
                [active]="activeTab() === 2"
              />
            </p-card>
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</section>
