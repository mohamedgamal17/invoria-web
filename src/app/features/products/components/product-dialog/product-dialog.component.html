<p-dialog
  [header]="mode() === 'create' ? 'Add New Product' : 'Edit Product'"
  [(visible)]="visible"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [style]="{ width: '100%', maxWidth: '450px' }"
  [breakpoints]="{ '960px': '75vw', '641px': '90vw' }"
  (onHide)="onHide()"
  styleClass="modern-dialog"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6 pt-2">
    <div class="space-y-5">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-muted-foreground uppercase tracking-wider" for="productName">Product Name</label>
        <input
          id="productName"
          name="productName"
          type="text"
          pInputText
          formControlName="name"
          class="w-full rounded-lg border-border bg-surface-2 focus:ring-2 focus:ring-focus transition-all"
          [disabled]="saving()"
          placeholder="Enter product name"
        />
        @if (form.controls.name.invalid && form.controls.name.touched) {
          <p-message severity="error" text="Product name is required." />
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-muted-foreground uppercase tracking-wider" for="productPrice">Price (EGP)</label>
        <p-inputNumber
          id="productPrice"
          name="productPrice"
          formControlName="price"
          [disabled]="saving()"
          mode="decimal"
          [minFractionDigits]="2"
          [min]="0.01"
          [maxFractionDigits]="2"
          inputId="productPrice"
          styleClass="w-full"
          inputStyleClass="w-full rounded-lg border-border bg-surface-2 focus:ring-2 focus:ring-focus transition-all tabular-nums"
        />
        @if (form.controls.price.invalid && form.controls.price.touched) {
          <p-message severity="error" text="Price must be greater than zero." />
        }
      </div>
    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-end gap-3 pt-5 border-t border-border mt-8">
      <p-button
        label="Cancel"
        type="button"
        [text]="true"
        styleClass="w-full sm:w-auto px-4 py-2.5 text-sm font-semibold text-muted-foreground hover:bg-muted rounded-xl transition-all"
        [disabled]="saving()"
        (onClick)="cancel.emit()"
      />

      <p-button
        [label]="mode() === 'create' ? 'Create Product' : 'Save Changes'"
        type="submit"
        [disabled]="saving()"
        [loading]="saving()"
        styleClass="w-full sm:w-auto px-6 py-3 bg-primary text-primary-foreground text-sm font-bold rounded-xl shadow-md hover:opacity-90 transition-all focus:ring-2 focus:ring-focus active:scale-[0.98]"
      />
    </div>
  </form>
</p-dialog>
