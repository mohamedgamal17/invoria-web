@if (variant() === 'mobile') {
  @for (_ of rowIndices(); track _) {
    <div class="rounded-xl border border-border bg-surface p-4 shadow-sm">
      <div class="flex items-start justify-between gap-3 mb-4">
        <div class="space-y-2 flex-1">
          <p-skeleton height="1.25rem" width="80%"></p-skeleton>
          <p-skeleton height="0.875rem" width="40%"></p-skeleton>
        </div>
        <p-skeleton height="1rem" width="5rem" borderRadius="999px"></p-skeleton>
      </div>
      <div class="flex items-center justify-between gap-4 mb-4">
        <div class="space-y-1">
          <p-skeleton height="0.65rem" width="3rem"></p-skeleton>
          <p-skeleton height="1.25rem" width="3rem"></p-skeleton>
        </div>
        <div class="flex flex-col items-end gap-1">
          <p-skeleton height="0.65rem" width="3rem"></p-skeleton>
          <p-skeleton height="0.65rem" width="3rem"></p-skeleton>
        </div>
      </div>
      <div class="flex justify-between items-center pt-3 border-t border-border/50">
        <div class="space-y-1">
          <p-skeleton height="0.75rem" width="2rem"></p-skeleton>
          <p-skeleton height="1.25rem" width="5rem"></p-skeleton>
        </div>
        <div class="flex flex-col items-end gap-2">
          <p-skeleton height="2.25rem" width="7.5rem" borderRadius="8px"></p-skeleton>
        </div>
      </div>
    </div>
  }
} @else {
  @for (_ of rowIndices(); track _) {
    <tr>
      <td class="px-4 py-5">
        <div class="flex flex-col gap-2">
          <p-skeleton height="1.1rem" width="60%"></p-skeleton>
          <p-skeleton height="0.8rem" width="40%"></p-skeleton>
        </div>
      </td>
      <td class="px-4 py-5 text-right">
        <p-skeleton height="1.1rem" width="4rem" styleClass="ml-auto"></p-skeleton>
      </td>
      <td class="px-4 py-5 text-right">
        <p-skeleton height="1.1rem" width="3.5rem" styleClass="ml-auto"></p-skeleton>
      </td>
      <td class="px-4 py-5 text-right">
        <p-skeleton height="1.1rem" width="3.5rem" styleClass="ml-auto"></p-skeleton>
      </td>
      <td class="px-4 py-5 text-center">
        <div class="flex items-center justify-center gap-2">
          <p-skeleton shape="circle" size="0.5rem"></p-skeleton>
          <p-skeleton height="0.875rem" width="5.5rem"></p-skeleton>
        </div>
      </td>
      <td class="px-4 py-5 text-right">
        <div class="flex justify-end">
          <p-skeleton height="2rem" width="4.5rem" borderRadius="6px" styleClass="ml-auto"></p-skeleton>
        </div>
      </td>
    </tr>
  }
}
