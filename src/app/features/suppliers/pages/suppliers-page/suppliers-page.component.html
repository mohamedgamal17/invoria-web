<p-toast />
<section class="flex flex-col gap-8">
  <app-supplier-header (create)="goToCreate()" />

  <app-suppliers-filter-panel
    [name]="nameFilter()"
    [loading]="listLoading()"
    (filtersChange)="onFiltersChange($event)"
    (clearFilters)="onClearFilters()"
  />

  <app-supplier-list
    [suppliers]="suppliers()"
    [isListLoading]="listLoading()"
    [totalRecords]="paging().totalCount"
    [first]="first()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="onPageChange($event)"
    (clearFilters)="onClearFilters()"
    (viewSupplier)="goToDetails($event)"
  />
</section>
