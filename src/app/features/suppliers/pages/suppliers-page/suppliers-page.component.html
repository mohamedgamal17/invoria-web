<p-toast />

<section class="space-y-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div class="space-y-1">
      <h1 class="text-3xl font-bold tracking-tight text-foreground">Suppliers</h1>
      <p class="text-sm text-muted-foreground">Manage procurement suppliers, codes, and contact details.</p>
    </div>
    <div class="flex items-center gap-2">
      <p-button
        label="Create Supplier"
        icon="pi pi-plus"
        styleClass="rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-primary-foreground shadow-sm hover:opacity-90 transition-all focus:ring-2 focus:ring-focus"
        (onClick)="navigateToCreate()"
      />
    </div>
  </div>

  <app-supplier-list
    [suppliers]="displaySuppliers()"
    [isListLoading]="suppliersResource.isLoading()"
    [totalRecords]="displayPaging().totalCount"
    [first]="first()"
    [pageSize]="pageSize()"
    [nameFilter]="qFromRoute()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="onPageChange($event)"
    (nameFilterChange)="onNameFilterChange($event)"
    (viewSupplier)="goToDetails($event)"
  />
</section>
