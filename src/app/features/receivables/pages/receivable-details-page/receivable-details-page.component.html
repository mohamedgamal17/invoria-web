<p-toast />

<section class="flex flex-col gap-8">
  <p-button
    icon="pi pi-arrow-left"
    label="Back to receivables"
    [text]="true"
    styleClass="px-0 text-sm text-muted-foreground hover:text-foreground self-start"
    (onClick)="backToList()"
  />

  @if (receivableResource.isLoading()) {
    <p-card styleClass="border border-border/60 rounded-2xl shadow-sm">
      <div class="space-y-5 p-1">
        <p-skeleton height="2rem" width="45%"></p-skeleton>
        <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
          <p-skeleton height="5.5rem"></p-skeleton>
          <p-skeleton height="5.5rem"></p-skeleton>
          <p-skeleton height="5.5rem"></p-skeleton>
        </div>
        <p-skeleton height="1rem" width="80%"></p-skeleton>
      </div>
    </p-card>
  } @else if (error()) {
    <p-card styleClass="border border-destructive/30 rounded-2xl shadow-sm">
      <div class="flex flex-col gap-4 p-1 sm:flex-row sm:items-center sm:justify-between">
        <div class="space-y-1">
          <h2 class="text-base font-semibold text-foreground">Unable to load receivable</h2>
          <p class="text-sm text-destructive">{{ error() }}</p>
        </div>
        <p-button
          label="Retry"
          icon="pi pi-refresh"
          styleClass="rounded-xl px-4 py-2.5 text-sm font-semibold"
          (onClick)="retry()"
        />
      </div>
    </p-card>
  } @else if (displayReceivable(); as receivable) {
    <app-page-header
      [title]="receivable.id"
      [description]="'Customer: ' + receivable.partyId + ' &middot; Order: ' + receivable.sourceId + ' &middot; ' + (receivable.createdAt | date: 'medium')"
      eyebrow="Receivable"
      eyebrowIcon="pi pi-file"
    />

    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" [lazy]="true">
      <p-tablist>
        <p-tab [value]="0">Overview</p-tab>
        <p-tab [value]="1">Settlements</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="0">
          <div class="pt-5">
            <app-receivable-details-overview-card [receivable]="receivable" [currencyCode]="currencyCode" />
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="1">
          <div class="pt-5">
            <app-receivable-settlements-tab [settlements]="receivable.settlements" [currencyCode]="currencyCode" />
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</section>
