<p-card styleClass="border border-border">
  <div class="mb-4 flex flex-col gap-1 border-b border-border pb-4">
    <span class="text-xs font-bold uppercase tracking-widest text-primary">Return Lines</span>
    <p class="m-0 text-sm text-muted-foreground">Products included in this return.</p>
  </div>

  <p-table
    [value]="returnLines()"
    dataKey="id"
    [rowHover]="true"
    [stripedRows]="true"
    styleClass="p-datatable-sm"
  >
    <ng-template pTemplate="header">
      <tr>
        <th class="px-4 py-4 font-bold uppercase tracking-wider">Product</th>
        <th class="px-4 py-4 font-bold uppercase tracking-wider text-center">Quantity</th>
        <th class="px-4 py-4 font-bold uppercase tracking-wider text-right">Price</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-line>
      <tr>
        <td class="px-4 py-4">
          <div class="flex flex-col min-w-0">
            <span class="truncate text-sm font-semibold text-foreground">
              {{ line.product?.name ?? 'Unknown Product' }}
            </span>
            <span class="text-xs text-muted-foreground font-mono">{{ line.productId | slice:-8 }}</span>
          </div>
        </td>
        <td class="px-4 py-4 text-center">
          <span class="text-sm font-semibold tabular-nums text-foreground">{{ line.quantity }}</span>
        </td>
        <td class="px-4 py-4 text-right">
          <span class="text-sm font-semibold tabular-nums text-foreground">
            {{ line.product?.price | currency:'EGP':'symbol-narrow' }}
          </span>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="px-4 py-8 text-center text-sm text-muted-foreground">
          No return lines.
        </td>
      </tr>
    </ng-template>
  </p-table>
</p-card>
