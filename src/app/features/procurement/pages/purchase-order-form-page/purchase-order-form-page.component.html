<p-toast />

<section class="space-y-6">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <p-button
      icon="pi pi-arrow-left"
      [label]="mode() === 'create' ? 'Back to purchase orders' : 'Back to details'"
      [text]="true"
      (onClick)="goBack()"
    />
    <h1 class="text-2xl font-bold text-foreground">
      {{ mode() === 'create' ? 'Create purchase order' : 'Edit purchase order' }}
    </h1>
  </div>

  <p-card styleClass="border border-border">
    @if (loading()) {
      <div class="text-sm text-muted-foreground">Loading purchase order…</div>
    } @else {
      <app-purchase-order-form
        [mode]="mode()"
        [purchaseNumber]="purchaseNumber()"
        [subTotal]="subTotal()"
        [(supplierId)]="supplierId"
        [resolvedSupplier]="supplierDisplayRef()"
        [(taxAmount)]="taxAmount"
        [(discountAmount)]="discountAmount"
        [draftItems]="draftItems()"
        [saving]="saving()"
        [(selectedProduct)]="selectedProduct"
        [products]="products()"
        [isProductLoading]="isProductLoading()"
        [(itemQuantity)]="itemQuantity"
        [(itemUnitPrice)]="itemUnitPrice"
        [(itemSupplierProductCode)]="itemSupplierProductCode"
        (submit)="submit()"
        (cancel)="goBack()"
        (searchProducts)="searchProducts($event)"
        (productSelect)="onProductSelect($event)"
        (clearProduct)="clearProductSelection()"
        (addItem)="addItem()"
        (removeItem)="removeItem($event)"
        (calculateTotal)="calculateSubTotal()"
      />
    }
  </p-card>
</section>
