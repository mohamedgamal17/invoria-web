<div class="flex flex-col gap-1.5 min-w-[10rem]">
  <div class="flex gap-2 items-start">
    <p-autocomplete
      [ngModel]="selectedProduct()"
      (ngModelChange)="onModelChange($event)"
      [suggestions]="suggestions()"
      (completeMethod)="onComplete($event)"
      field="name"
      optionLabel="name"
      dataKey="id"
      [forceSelection]="true"
      [dropdown]="true"
      [minLength]="0"
      placeholder="Search product…"
      [name]="'productPicker_' + rowIndex()"
      styleClass="flex-1"
      inputStyleClass="w-full rounded-lg border-border bg-surface-2 focus:ring-2 focus:ring-focus transition-all text-sm"
      appendTo="body"
      [disabled]="isControlDisabled()"
      (onFocus)="onInputFocus()"
      (onBlur)="markTouched()"
    />
    @if (selectedProduct()) {
      <p-button
        type="button"
        icon="pi pi-times"
        [text]="true"
        [rounded]="true"
        severity="danger"
        [disabled]="isControlDisabled()"
        (onClick)="clearSelection()"
        aria-label="Remove product"
      />
    }
  </div>
  @if (selectedProduct(); as p) {
    <p class="text-[10px] text-muted-foreground break-all">{{ p.name }}</p>
  }
</div>
