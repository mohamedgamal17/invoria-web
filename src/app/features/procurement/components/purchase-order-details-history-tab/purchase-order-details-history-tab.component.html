<p-card styleClass="border border-border" header="Status history">
  @if (events.length) {
    <p-timeline [value]="events" styleClass="w-full">
      <ng-template pTemplate="marker" let-event>
        <p-tag
          [value]="event.toLabel"
          [severity]="event.severity"
          styleClass="px-2 py-0.5 text-[10px] uppercase font-bold tracking-tight rounded-md border border-border shrink-0"
        />
      </ng-template>
      <ng-template pTemplate="content" let-event>
        <div class="flex flex-col gap-1.5 mb-6 -mt-0.5">
          <div class="flex flex-wrap items-center gap-2 text-sm">
            <span class="font-medium text-muted-foreground">{{ event.fromLabel }}</span>
            <span class="text-muted-foreground/80" aria-hidden="true">→</span>
            <span class="font-semibold text-foreground">{{ event.toLabel }}</span>
          </div>
          <div class="flex flex-wrap items-baseline gap-x-3 gap-y-0.5 text-xs text-muted-foreground">
            <span>{{ event.changedAt | date: 'medium' }}</span>
          </div>
          @if (event.reason?.trim()) {
            <div
              class="text-xs leading-relaxed italic text-muted-foreground/90 bg-surface-2/80 p-2.5 rounded-lg border border-border/40 relative overflow-hidden mt-1"
            >
              <div class="absolute inset-y-0 left-0 w-0.5 bg-primary/35" aria-hidden="true"></div>
              <span class="pl-2">{{ event.reason }}</span>
            </div>
          }
        </div>
      </ng-template>
    </p-timeline>
  } @else {
    <p class="text-sm text-muted-foreground">No transition history available.</p>
  }
</p-card>
