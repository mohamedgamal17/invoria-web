<p-dialog
  [header]="mode() === 'create' ? 'Add New Customer' : 'Edit Customer'"
  [(visible)]="visible"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [style]="{ width: '100%', maxWidth: '450px' }"
  [breakpoints]="{ '960px': '75vw', '641px': '90vw' }"
  (onHide)="onDialogHide()"
  styleClass="modern-dialog"
>
  <form (ngSubmit)="onFormSubmit($event)" class="space-y-6 pt-2">
    <div class="space-y-5">
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-muted-foreground uppercase tracking-wider" for="customerName">Customer Name</label>
        <input
          id="customerName"
          name="customerName"
          type="text"
          pInputText
          [ngModel]="name()"
          (ngModelChange)="nameChange.emit($event)"
          class="w-full rounded-lg border-border bg-surface-2 focus:ring-2 focus:ring-focus transition-all"
          [disabled]="saving()"
          placeholder="Enter customer name"
        />
      </div>
    </div>

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-border mt-6">
      <p-button
        label="Cancel"
        type="button"
        [text]="true"
        styleClass="px-4 py-2 text-sm font-semibold text-muted-foreground hover:bg-muted rounded-lg transition-colors"
        [disabled]="saving()"
        (onClick)="onCancel()"
      />

      <p-button
        [label]="mode() === 'create' ? 'Create Customer' : 'Save Changes'"
        type="button"
        [disabled]="saving()"
        [loading]="saving()"
        styleClass="px-6 py-2.5 bg-primary text-primary-foreground text-sm font-bold rounded-lg shadow-sm hover:opacity-90 transition-all focus:ring-2 focus:ring-focus"
        (onClick)="submit.emit()"
      />
    </div>
  </form>
</p-dialog>
