<p-toast />

<section class="flex flex-col gap-8">
  <app-customer-header (create)="goToCreate()" />

  <app-customers-filter-panel
    [name]="nameFilter()"
    [loading]="listLoading()"
    (filtersChange)="onFiltersChange($event)"
    (clearFilters)="onClearFilters()"
  />

  <app-customer-list
    [customers]="customers()"
    [isListLoading]="listLoading()"
    [totalRecords]="paging().totalCount"
    [first]="first()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    (pageChange)="onPageChange($event)"
    (clearFilters)="onClearFilters()"
    (viewCustomer)="goToDetails($event)"
  />
</section>
