<p-toast />

<section class="flex flex-col gap-8">
  <app-details-toolbar
    title="Customer Details"
    description="View profile, audit history, and orders for this customer."
    backLabel="Back to Customers"
    (back)="backToList()"
  />

  @if (loading()) {
    <app-details-skeleton />
  } @else if (error(); as inlineError) {
    <app-error-card title="Unable to load customer" [message]="inlineError" (retry)="retry()" />
  } @else if (customer(); as customer) {
    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" [lazy]="true">
      <p-tablist>
        <p-tab [value]="tabs.Profile">Profile</p-tab>
        <p-tab [value]="tabs.Orders">Orders</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="tabs.Profile">
          <div class="pt-5">
            <app-customer-details-profile [customer]="customer" (edit)="goToEdit()" />
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="tabs.Orders">
          <div class="pt-6">
            <app-customer-details-orders-tab
              [orderNumber]="orderNumber()"
              [orderStatusFilter]="orderStatusFilter()"
              [paymentStatusFilter]="paymentStatusFilter()"
              [paymentTypeFilter]="paymentTypeFilter()"
              [orders]="orders()"
              [paging]="paging()"
              [first]="first()"
              [pageSize]="pageSize()"
              [loading]="ordersLoading()"
              (pageChange)="onOrdersPageChange($event)"
              (filtersChange)="onOrdersFiltersChange($event)"
              (clearFilters)="onOrdersFiltersClear()"
              (view)="goToOrderDetails($event)"
            />
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</section>
