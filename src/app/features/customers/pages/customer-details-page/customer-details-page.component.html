<p-toast />

<section class="space-y-6">
  <app-customer-details-toolbar (back)="backToList()" />

  @if (loading()) {
    <p-card styleClass="border border-border/60 rounded-2xl shadow-sm">
      <div class="space-y-5 p-1">
        <p-skeleton height="2rem" width="45%"></p-skeleton>
        <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
          <p-skeleton height="5.5rem"></p-skeleton>
          <p-skeleton height="5.5rem"></p-skeleton>
          <p-skeleton height="5.5rem"></p-skeleton>
        </div>
        <p-skeleton height="1rem" width="80%"></p-skeleton>
      </div>
    </p-card>
  } @else if (error()) {
    <p-card styleClass="border border-destructive/30 rounded-2xl shadow-sm">
      <div class="flex flex-col gap-4 p-1 sm:flex-row sm:items-center sm:justify-between">
        <div class="space-y-1">
          <h2 class="text-base font-semibold text-foreground">Unable to load customer</h2>
          <p class="text-sm text-destructive">{{ error() }}</p>
        </div>
        <p-button
          label="Retry"
          icon="pi pi-refresh"
          styleClass="rounded-xl px-4 py-2.5 text-sm font-semibold"
          (onClick)="retry()"
        />
      </div>
    </p-card>
  } @else if (customer(); as c) {
    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" [lazy]="true">
      <p-tablist>
        <p-tab [value]="0">Profile</p-tab>
        <p-tab [value]="1">Orders</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="0">
          <div class="pt-5">
            <app-customer-details-profile [customer]="c" (edit)="goToEdit()" />
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="1">
          <div class="pt-5">
            <app-customer-details-orders-tab [customerId]="c.id" />
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</section>
