<p-toast />
<p-confirmDialog />

<section class="flex flex-col gap-10">
  <p-button
    icon="pi pi-arrow-left"
    label="Back to orders"
    [text]="true"
    styleClass="px-0 text-sm text-muted-foreground hover:text-foreground self-start"
    (onClick)="backToList()"
  />

  @if (orderResource.isLoading()) {
    <p-card styleClass="border border-border/60 rounded-2xl shadow-sm">
      <div class="space-y-5 p-1">
        <p-skeleton height="2rem" width="45%"></p-skeleton>
        <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
          <p-skeleton height="5.5rem"></p-skeleton>
          <p-skeleton height="5.5rem"></p-skeleton>
          <p-skeleton height="5.5rem"></p-skeleton>
        </div>
        <p-skeleton height="1rem" width="80%"></p-skeleton>
      </div>
    </p-card>
  } @else if (error()) {
    <p-card styleClass="border border-destructive/30 rounded-2xl shadow-sm">
      <div class="flex flex-col gap-4 p-1 sm:flex-row sm:items-center sm:justify-between">
        <div class="space-y-1">
          <h2 class="text-base font-semibold text-foreground">Unable to load order</h2>
          <p class="text-sm text-destructive">{{ error() }}</p>
        </div>
        <p-button
          label="Retry"
          icon="pi pi-refresh"
          styleClass="rounded-xl px-4 py-2.5 text-sm font-semibold"
          (onClick)="retry()"
        />
      </div>
    </p-card>
  } @else if (displayOrder(); as order) {
    <app-page-header
      [title]="order.orderNumber"
      [description]="order.customerName + ' · ' + (order.orderDate | date: 'medium') + ' · ' + orderStatusLabel(order.status)"
    >
      @if (canEditOrder(order)) {
        <p-button
          icon="pi pi-pencil"
          label="Edit"
          severity="secondary"
          [outlined]="true"
          [disabled]="actionSaving()"
          (onClick)="goToEdit()"
        />
      }
      @for (action of availableActions(); track action) {
        <p-button
          [label]="ORDER_ACTION_UI[action].label"
          [icon]="ORDER_ACTION_UI[action].icon"
          [severity]="ORDER_ACTION_UI[action].severity"
          [loading]="actionSaving()"
          [disabled]="actionSaving()"
          (onClick)="onAction(action)"
        />
      }
    </app-page-header>

    <app-order-summary-card [order]="order" [currencyCode]="currencyCode" />

    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" [lazy]="true">
      <p-tablist>
        <p-tab [value]="0">Overview</p-tab>
        <p-tab [value]="1">Line items</p-tab>
        <p-tab [value]="2">Return items</p-tab>
        <p-tab [value]="3">Payment</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="0">
          <div class="pt-5">
            <app-order-details-overview-tab [order]="order" [currencyCode]="currencyCode" />
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="1">
          <div class="pt-5">
            <app-order-details-line-items-tab [order]="order" [currencyCode]="currencyCode" />
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="2">
          <div class="pt-5">
            <app-order-details-return-items-tab
              [order]="order"
              [currencyCode]="currencyCode"
              [recordingDisabled]="actionSaving()"
              (returnItemsRecorded)="onReturnItemsRecorded($event)"
            />
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="3">
          <div class="pt-5">
            <app-order-details-payment-tab
              [order]="order"
              [currencyCode]="currencyCode"
              [recordingDisabled]="actionSaving()"
              (refreshRequested)="loadOrder()"
            />
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</section>
