<section class="space-y-6">
  <app-order-header 
    (create)="goToCreatePage()"
  />

  <app-order-list
    [orders]="displayOrders()"
    [totalRecords]="displayPaging().totalCount"
    [first]="first()"
    [pageSize]="pageSize()"
    [pageSizeOptions]="pageSizeOptions"
    [loading]="ordersResource.isLoading()"
    [showDelete]="false"
    (pageChange)="onPageChange($event)"
    (view)="goToDetails($event)"
  />
</section>
