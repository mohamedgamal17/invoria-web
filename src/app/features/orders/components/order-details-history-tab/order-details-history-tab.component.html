<p-card styleClass="border border-border" header="Status history">
  @if (events().length) {
    <p-timeline [value]="events()">
      <ng-template pTemplate="content" let-event>
        <div class="mb-4">
          <div class="font-medium text-foreground">{{ event.to }}</div>
          <div class="text-xs text-muted-foreground">{{ event.timestamp | date: 'short' }}</div>
          @if (event.reason) {
            <div class="text-xs text-muted-foreground mt-1">{{ event.reason }}</div>
          }
        </div>
      </ng-template>
    </p-timeline>
  } @else {
    <p class="text-sm text-muted-foreground">No transition history available.</p>
  }
</p-card>
