<section class="rounded-xl border border-border bg-surface p-4 shadow-sm">
  <header class="mb-3 flex items-start justify-between gap-3">
    <div>
      <h3 class="text-sm font-semibold tracking-tight">{{ title() }}</h3>
      @if (subtitle()) {
        <p class="mt-0.5 text-xs text-muted-foreground">{{ subtitle() }}</p>
      }
    </div>
    @if (loading()) {
      <span class="h-2 w-2 animate-pulse rounded-full bg-primary/60"></span>
    }
  </header>

  @if (loading()) {
    <p-skeleton width="100%" height="18rem" styleClass="rounded-lg" />
  } @else if (options()) {
    <div echarts [options]="options()!" [autoResize]="true" [class]="'w-full ' + heightClass()"></div>
  } @else {
    <div class="flex h-72 w-full items-center justify-center rounded-lg border border-dashed border-border bg-surface-2/50">
      <p class="text-sm text-muted-foreground">No data available.</p>
    </div>
  }
</section>
