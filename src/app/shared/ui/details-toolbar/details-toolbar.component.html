@if (title(); as toolbarTitle) {
  <div class="rounded-2xl border border-border/60 bg-surface-1 p-4 shadow-sm sm:p-5">
    <div class="space-y-2">
      <p-button
        icon="pi pi-arrow-left"
        [label]="backLabel()"
        [text]="true"
        styleClass="px-0 text-sm text-muted-foreground hover:text-foreground"
        (onClick)="back.emit()"
      />
      <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
        <div class="space-y-1">
          <h1 class="text-2xl font-bold tracking-tight text-foreground sm:text-3xl">
            {{ toolbarTitle }}
          </h1>
          @if (description()) {
            <p class="text-sm text-muted-foreground">
              {{ description() }}
            </p>
          }
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <ng-content />
        </div>
      </div>
    </div>
  </div>
} @else {
  <p-button
    icon="pi pi-arrow-left"
    [label]="backLabel()"
    [text]="true"
    styleClass="px-0 text-sm text-muted-foreground hover:text-foreground self-start"
    (onClick)="back.emit()"
  />
}
