<header class="sticky top-0 z-30 border-b border-border/80 bg-surface/85 backdrop-blur">
  <div class="mx-auto flex h-14 w-full max-w-7xl items-center gap-2 px-3 md:px-5">
    <button
      type="button"
      class="nav-icon-btn md:hidden"
      aria-label="Open navigation menu"
      (click)="menuClick.emit()"
    >
      <lucide-icon [img]="menuIcon" class="size-5" aria-hidden="true" />
    </button>

    <button
      type="button"
      class="nav-icon-btn hidden md:inline-flex"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.aria-pressed]="collapsed()"
      (click)="collapseToggle.emit()"
    >
      <lucide-icon
        [img]="collapsed() ? panelLeftOpenIcon : panelLeftCloseIcon"
        class="size-5"
        aria-hidden="true"
      />
    </button>

    <div class="flex-1"></div>

    <button
      type="button"
      class="nav-icon-btn"
      [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="theme.toggleDark()"
    >
      <lucide-icon
        [img]="theme.isDark() ? sunIcon : moonIcon"
        class="size-5 transition-transform duration-200"
        aria-hidden="true"
      />
    </button>

    <p-menu
      #userMenu
      [popup]="true"
      [model]="userMenuItems"
      appendTo="body"
      (onShow)="isUserMenuVisible.set(true)"
      (onHide)="isUserMenuVisible.set(false)"
    />

    <button
      type="button"
      class="nav-user-btn"
      aria-haspopup="menu"
      [attr.aria-expanded]="isUserMenuVisible()"
      aria-label="Open user menu"
      (click)="userMenu.toggle($event)"
    >
      <span
        class="flex size-8 shrink-0 items-center justify-center rounded-full bg-primary text-xs font-bold text-primary-foreground shadow-sm shadow-primary/25"
      >
        {{ user.initials }}
      </span>
      <span class="hidden min-w-0 flex-col items-start leading-tight sm:flex">
        <span class="max-w-36 truncate text-xs font-semibold text-foreground">{{ user.name }}</span>
        <span class="max-w-36 truncate text-2xs text-muted-foreground">{{ user.email }}</span>
      </span>
      <lucide-icon
        [img]="chevronDownIcon"
        [size]="14"
        class="hidden shrink-0 text-muted-foreground transition-transform duration-200 sm:block"
        [class.rotate-180]="isUserMenuVisible()"
        aria-hidden="true"
      />
    </button>
  </div>
</header>
