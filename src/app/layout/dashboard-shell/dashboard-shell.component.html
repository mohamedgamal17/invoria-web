<div class="min-h-dvh bg-surface text-foreground invoria-gradient-surface">
  <div class="grid min-h-dvh grid-cols-1 md:grid-cols-[auto_1fr]">
    <app-dashboard-sidebar class="hidden md:block" [collapsed]="isSidebarCollapsed()" />

    @if (isMobileSidebarOpen()) {
      <div
        class="drawer-backdrop fixed inset-0 z-40 bg-foreground/40 backdrop-blur-sm md:hidden"
        (click)="closeMobileSidebar()"
        aria-hidden="true"
      ></div>
      <app-dashboard-sidebar
        class="mobile-drawer fixed inset-y-0 left-0 z-50 md:hidden"
        [collapsed]="false"
        (navigate)="closeMobileSidebar()"
      />
    }

    <div class="min-w-0">
      <app-dashboard-navbar
        [collapsed]="isSidebarCollapsed()"
        (collapseToggle)="toggleSidebarCollapsed()"
        (menuClick)="openMobileSidebar()"
      />
      <div class="relative h-1 overflow-hidden bg-foreground/10" aria-hidden="true">
        @if (navigationLoading.isLoading()) {
          <div class="route-progress-indicator"></div>
        }
      </div>
      <main class="mx-auto w-full max-w-7xl p-4 md:p-6">
        <router-outlet />
      </main>
    </div>
  </div>
</div>
