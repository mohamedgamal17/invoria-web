<p-toast />

<section class="flex flex-col gap-8">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
    <app-details-toolbar backLabel="Back to purchase orders" (back)="backToList()" />
    @if (purchaseOrder()) {
      <div class="flex flex-wrap items-center gap-2 justify-end">
        @if (canEdit()) {
          <p-button
            icon="pi pi-pencil"
            label="Edit"
            severity="secondary"
            [outlined]="true"
            [disabled]="transitionInProgress()"
            (onClick)="goToEdit()"
          />
        }
        @for (action of availableTransitions(); track action) {
          <p-button
            [label]="actionUi[action].label"
            [icon]="actionUi[action].icon"
            [severity]="actionUi[action].severity"
            [outlined]="action === 'reject' || action === 'cancel'"
            [loading]="transitionInProgress()"
            [disabled]="transitionInProgress()"
            (onClick)="onTransition(action)"
          />
        }
      </div>
    }
  </div>

  @if (loading()) {
    <app-details-skeleton />
  } @else if (error(); as errorMessage) {
    <app-error-card
      title="Unable to load purchase order"
      [message]="errorMessage"
      (retry)="retry()"
    />
  } @else if (purchaseOrder(); as po) {
    <p-card styleClass="border border-border">
      <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
        <div class="min-w-0 space-y-1">
          <div class="flex flex-wrap items-center gap-3">
            <h1 class="text-2xl font-bold text-foreground truncate">{{ po.purchaseNumber }}</h1>
            <p-tag
              [value]="stateLabel(po.state)"
              [severity]="stateSeverity(po.state)"
              styleClass="px-2 py-1 text-[10px] uppercase font-bold tracking-tight rounded-md border border-border shrink-0"
            />
          </div>
          <p class="text-sm text-muted-foreground">
            {{ supplierLine(po) }}
          </p>
        </div>
      </div>
    </p-card>

    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" [lazy]="true">
      <p-tablist>
        <p-tab [value]="tabs.Overview">Overview</p-tab>
        <p-tab [value]="tabs.Lines">Line items</p-tab>
        <p-tab [value]="tabs.History">Status history</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="tabs.Overview">
          <div class="pt-5 w-full">
            <app-purchase-order-details-overview-tab
              [purchaseOrder]="po"
              [currencyCode]="currencyCode"
              [supplierLine]="supplierLine(po)"
            />
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="tabs.Lines">
          <div class="pt-5 min-w-0">
            <app-purchase-order-details-lines-tab
              [purchaseOrder]="po"
              [currencyCode]="currencyCode"
              [lineLabel]="lineLabelFn"
            />
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="tabs.History">
          <div class="pt-5">
            <app-purchase-order-details-history-tab [events]="stateTimelineEvents()" />
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  }
</section>
