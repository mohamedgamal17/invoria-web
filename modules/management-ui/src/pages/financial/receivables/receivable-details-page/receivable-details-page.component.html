<p-toast />

<section class="flex flex-col gap-8">
  <app-details-toolbar backLabel="Back to receivables" (back)="backToList()" />

  @if (loading()) {
    <app-details-skeleton />
  } @else if (error(); as errorMessage) {
    <app-error-card title="Unable to load receivable" [message]="errorMessage" (retry)="retry()" />
  } @else if (receivable(); as receivable) {
    <app-page-header
      [title]="receivable.id"
      [description]="
        'Customer: ' +
        receivable.partyId +
        ' &middot; Order: ' +
        receivable.sourceId +
        ' &middot; ' +
        (receivable.createdAt | date: 'medium')
      "
      eyebrow="Receivable"
      eyebrowIcon="pi pi-file"
    />

    <p-tabs [value]="activeTab()" (valueChange)="onTabChange($event)" [lazy]="true">
      <p-tablist>
        <p-tab [value]="tabs.Overview">Overview</p-tab>
        <p-tab [value]="tabs.Settlements">Settlements</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel [value]="tabs.Overview">
          <div class="pt-5">
            <app-financial-obligation-overview-card
              [obligation]="receivable"
              entityLabel="Receivable"
              partyLabel="Customer"
              sourceLabel="Order"
              partyRoute="/customers"
              sourceRoute="/orders"
              sourceDisplayKey="orderNumber"
              [currencyCode]="currencyCode"
              (settleRequest)="openSettleModal()"
            />
          </div>
        </p-tabpanel>
        <p-tabpanel [value]="tabs.Settlements">
          <div class="pt-5">
            <app-settlements-tab
              [settlements]="receivable.settlements"
              [currencyCode]="currencyCode"
              [outstandingAmount]="receivable.outstandingAmount"
              entityName="receivable"
              (settleRequest)="openSettleModal()"
            />
          </div>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>

    <app-settle-modal
      [visible]="settleModalVisible()"
      (visibleChange)="onSettleModalVisibleChange($event)"
      [outstandingAmount]="receivable.outstandingAmount"
      [currencyCode]="currencyCode"
      [settling]="isSettling()"
      (settle)="onSettle($event)"
      (cancel)="closeSettleModal()"
    />
  }
</section>
