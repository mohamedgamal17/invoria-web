<section class="flex flex-col gap-8">
  <div class="flex items-center justify-between">
    <p-button
      icon="pi pi-arrow-left"
      label="Back to Orders"
      [text]="true"
      (onClick)="goBack()"
    />
    <h1 class="text-2xl font-bold text-foreground">
      {{ mode() === 'create' ? 'Create Order' : 'Edit Order' }}
    </h1>
  </div>

  <p-card styleClass="border border-border">
    @if (loading()) {
      <div class="text-sm text-muted-foreground">Loading order details...</div>
    } @else {
      <app-order-form
        [mode]="mode()"
        [orderNumber]="orderNumber()"
        [totalAmount]="totalAmount()"
        [saving]="saving()"
        [customers]="customers()"
        [isCustomerLoading]="isCustomerLoading()"
        [products]="products()"
        [isProductLoading]="isProductLoading()"
        [initialCustomer]="initialCustomer()"
        [initialPaymentType]="initialPaymentType()"
        [initialItems]="initialItems()"
        (submit)="submit($event)"
        (itemsChange)="onItemsChange($event)"
        (cancel)="goBack()"
        (searchCustomers)="searchCustomers($event)"
        (searchProducts)="searchProducts($event)"
      />
    }
  </p-card>
</section>
